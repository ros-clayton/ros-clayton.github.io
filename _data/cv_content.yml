working_papers:
  - title: "The impact of early grade repetition on test scores: Evidence from a regression discontinuity design in South Africa"
    short_title: The impact of early grade repetition on test scores
    url: https://resep.sun.ac.za/wp-content/uploads/2026/04/WP06_25_Ros-Clayton-Impact-of-early-grade-repetition.pdf
    status: Resep working paper, 2025.
    description: Uses administrative data for six provinces and an RD design to estimate the causal impact of Grade 1 and Grade 4 repetition on later achievement.
    cv_description: Extended version of the paper submitted to this workshop. Uses administrative data for six provinces and an RD design to estimate the causal impact of Grade 1 and Grade 4 repetition on later achievement.
  - title: Linguistic interdependence? Foundation Phase mastery in home language as a predictor of grade 4 repetition and EFAL marks
    short_title: Foundation Phase mastery in home language as a predictor of grade 4 repetition and EFAL marks
    url: https://resep.sun.ac.za/wp-content/uploads/2026/04/WP02_25-Linguistic-Interdependence-Ros-Clayton.pdf
    status: Resep working paper, 2025.
    description: Studies the relationship between Foundation Phase language proficiency and later academic outcomes.
  - title: "From Grade 7 arithmetic to matric: A quantitative evaluation of the Numeric afterschool maths program"
    url: https://numeric.org/wp-content/uploads/2024/05/Numeric-Learner-Longitudinal-Study-full-report.pdf
    status: Evaluation report, 2024.
    description: Randomised evaluation of an after-school programme for primary school learners in South Africa, estimating causal impacts on academic outcomes up to high school completion.
  - title: "Growing apart: Tracking the pro-girl achievement gap across early grades in South African primary schools"
    status: Manuscript under revision for journal submission, 2026.
    coauthors: Co-authored with Dr Gabrielle Wills
    description: Responsible for data analysis and contributed to empirical strategy.

in_progress:
